name: CI/CD Skinlab Landing

on:
  push:
    branches:
      - master

jobs:
  ci:
    name: CI - Verify and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Generate Nuxt static site
        run: npm run generate

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: skinlab-landing-build
          path: .output/public

  deploy:
    name: CD - Deploy
    needs: ci
    runs-on: self-hosted

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: skinlab-landing-build
          path: dist

      - name: Deploy to Nginx
        run: |
          rsync -av --delete dist/ /var/www/skinlab-landing/