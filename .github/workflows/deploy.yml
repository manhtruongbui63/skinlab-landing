name: Deploy Skinlab Landing

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Nuxt static site
        run: npm run generate

      - name: Deploy to Nginx directory
        run: |
          rsync -av --delete .output/public/ /var/www/skinlab-landing/