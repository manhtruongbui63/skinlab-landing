name: CI/CD Skinlab Landing

on:
  push:
    branches:
      - master

jobs:
  ci:
    name: CI - Verify and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Generate Nuxt static site
        run: npm run generate

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: skinlab-landing-build
          path: .output/public

  deploy:
    name: CD - Deploy
    needs: ci
    runs-on: self-hosted

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: skinlab-landing-build
          path: dist

      - name: Create release
        run: |
          RELEASE_DIR="/var/www/skinlab-landing/releases/${{ github.sha }}"

          mkdir -p "$RELEASE_DIR"

          rsync -av --delete dist/ "$RELEASE_DIR/"

      - name: Activate release
        run: |
          RELEASE_DIR="/var/www/skinlab-landing/releases/${{ github.sha }}"

          ln -sfn "$RELEASE_DIR" /var/www/skinlab-landing/current

      - name: Health check
        run: |
          sleep 2
          curl --fail -H "Host: skinlab.local" http://127.0.0.1/