name: CI/CD Skinlab Landing

on:
  push:
    branches:
      - master

jobs:
  ci:
    name: CI - Verify and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Generate Nuxt static site
        run: npm run generate

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: skinlab-landing-build
          path: .output/public

  deploy:
    name: CD - Deploy
    needs: ci
    runs-on: self-hosted

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: skinlab-landing-build
          path: dist

      - name: Deploy release with rollback
        shell: bash
        run: |
          set -e

          BASE_DIR="/var/www/skinlab-landing"
          RELEASE_DIR="$BASE_DIR/releases/${{ github.sha }}"
          CURRENT_LINK="$BASE_DIR/current"

          echo "=== Current release before deploy ==="

          PREVIOUS_RELEASE=""

          if [ -L "$CURRENT_LINK" ]; then
            PREVIOUS_RELEASE=$(readlink -f "$CURRENT_LINK")
            echo "Previous release: $PREVIOUS_RELEASE"
          else
            echo "No previous release found"
          fi

          echo "=== Creating new release ==="

          mkdir -p "$RELEASE_DIR"

          rsync -av --delete dist/ "$RELEASE_DIR/"

          echo "New release: $RELEASE_DIR"

          echo "=== Activating new release ==="

          ln -sfn "$RELEASE_DIR" "$CURRENT_LINK"

          echo "Current now points to:"
          readlink -f "$CURRENT_LINK"

          echo "=== Running health check ==="

          sleep 2

          if curl --fail \
            -H "Host: skinlab.local" \
            curl --fail http://127.0.0.1:9999/ > /dev/null; then

            echo "Health check passed"
            echo "Deployment successful"

          else

            echo "Health check failed"

            if [ -n "$PREVIOUS_RELEASE" ]; then
              echo "Rolling back to:"
              echo "$PREVIOUS_RELEASE"

              ln -sfn "$PREVIOUS_RELEASE" "$CURRENT_LINK"

              echo "Rollback completed"
              echo "Current now points to:"
              readlink -f "$CURRENT_LINK"
            else
              echo "No previous release available for rollback"
            fi

            exit 1
          fi